
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: university-rag-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    container_name: university-rag-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    mem_limit: 320m

volumes:
  qdrant_data:
  redis_data:
